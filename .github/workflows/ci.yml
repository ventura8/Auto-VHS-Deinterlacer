name: Studio Quality CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.1"

jobs:
  static_analysis:
    name: "🔍 Static Quality Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: "3.12.13"
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
      - name: Run PowerShell Lint
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $settingsPath = Join-Path $PWD "tools/psscriptanalyzer.settings.psd1"
          $scripts = @("install.ps1", "run_pipeline_localy.ps1")
          $issues = @()
          foreach ($scriptPath in $scripts) {
            $issues += Invoke-ScriptAnalyzer -Path $scriptPath -Settings $settingsPath
          }
          if ($issues.Count -gt 0) {
            $issues | Select-Object RuleName, Severity, ScriptName, Line, Message | Format-Table -AutoSize
            throw "PowerShell lint failed with $($issues.Count) issue(s)."
          }
      - name: Run Ruff
        run: |
          poetry run ruff check .
      - name: Run Flake8
        run: |
          poetry run flake8 .
      - name: Run Pylint
        run: |
          poetry run pylint auto_deinterlancer.py modules .github/scripts

  technical_validation:
    name: "🧪 Automated Pipeline Validation"
    needs: static_analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: "3.12.13"
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Create Mock Environment
        run: |
          mkdir -p input
          touch input/test_video.mp4
      - name: Run Tests with Coverage
        env:
          AUTO_VHS_SKIP_HW_DETECT: "1"
        run: |
          mkdir -p assets
          poetry run pytest --cov=modules --cov=auto_deinterlancer --cov-branch --cov-report=xml:assets/coverage.xml --cov-report=term --cov-fail-under=90 tests/
      - name: Enforce Per-File Coverage >= 90%
        run: |
          poetry run python .github/scripts/enforce_per_file_coverage.py assets/coverage.xml 90
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v7.0.1
        if: success()
        with:
          name: coverage-artifacts
          path: assets/coverage.xml
          retention-days: 1

  quality_reporting:
    name: "📊 Analytics & Coverage Reporting"
    needs: technical_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Poetry Environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: "3.12.13"
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Download Coverage Results
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-artifacts
          path: ./assets
      - name: Generate Coverage Summary
        run: |
          poetry run python .github/scripts/generate_coverage_summary.py assets/coverage.xml > assets/coverage_summary.md
          cat assets/coverage_summary.md >> $GITHUB_STEP_SUMMARY
