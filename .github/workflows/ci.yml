name: Studio Quality CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.2"

jobs:
  quality_pipeline:
    name: "🔍🧪📊 Unified Quality Pipeline"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure Poetry In-Project Virtualenv
        run: |
          poetry config virtualenvs.in-project true

      - name: Sync Poetry Lock File
        run: |
          poetry check --lock || poetry lock

      - name: Install Light + Dev Dependencies
        run: |
          poetry install -v --only main,dev --no-root

      - name: Run PowerShell Lint
        shell: pwsh
        run: |
          ./.github/scripts/run_powershell_lint.ps1 -RepoRoot $PWD
      - name: Run Taplo TOML Lint
        run: |
          files=$(git ls-files '*.toml')
          if [ -z "$files" ]; then
            echo "No TOML files found to lint"
            exit 1
          fi
          poetry run taplo lint $files
      - name: Run Bandit Security Scan
        run: |
          poetry run bandit -ll -r auto_deinterlancer.py modules .github/scripts
      - name: Run pip-audit Dependency Scan
        run: |
          poetry run pip-audit
      - name: Run Black
        run: |
          poetry run black --check auto_deinterlancer.py modules tests .github/scripts
      - name: Run isort
        run: |
          poetry run isort --check-only auto_deinterlancer.py modules tests .github/scripts
      - name: Run Ruff
        run: |
          poetry run ruff check auto_deinterlancer.py modules tests .github/scripts
      - name: Run Flake8
        run: |
          poetry run flake8 auto_deinterlancer.py modules tests .github/scripts
      - name: Run Pylint
        run: |
          poetry run pylint auto_deinterlancer.py modules tests .github/scripts

      - name: Run Radon Complexity
        id: radon_complexity
        continue-on-error: true
        run: |
          mkdir -p assets
          set +e
          poetry run python .github/scripts/enforce_radon_grade.py --summary-out assets/radon_summary.md
          status=$?
          cat assets/radon_summary.md >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Run Radon Maintainability
        id: radon_maintainability
        continue-on-error: true
        run: |
          mkdir -p assets
          set +e
          poetry run python .github/scripts/enforce_radon_grade.py --metric mi --summary-out assets/radon_mi_summary.md
          status=$?
          cat assets/radon_mi_summary.md >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Run Radon Raw Metrics
        id: radon_raw
        continue-on-error: true
        run: |
          mkdir -p assets
          set +e
          set -o pipefail
          poetry run radon raw auto_deinterlancer.py modules tests .github/scripts | tee assets/radon_raw.txt
          status=$?
          {
            echo "## Radon Raw Metrics"
            echo
            echo "\`\`\`text"
            cat assets/radon_raw.txt
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Run Radon Halstead Metrics
        id: radon_halstead
        continue-on-error: true
        run: |
          mkdir -p assets
          set +e
          set -o pipefail
          poetry run radon hal auto_deinterlancer.py modules tests .github/scripts | tee assets/radon_hal.txt
          status=$?
          {
            echo "## Radon Halstead Metrics"
            echo
            echo "\`\`\`text"
            cat assets/radon_hal.txt
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
          exit $status

      - name: Check Radon Status
        if: always()
        run: |
          failed_steps=""

          if [ "${{ steps.radon_complexity.outcome }}" = "failure" ]; then
            failed_steps="${failed_steps} Radon Complexity"
          fi

          if [ "${{ steps.radon_maintainability.outcome }}" = "failure" ]; then
            failed_steps="${failed_steps} Radon Maintainability"
          fi

          if [ "${{ steps.radon_raw.outcome }}" = "failure" ]; then
            failed_steps="${failed_steps} Radon Raw Metrics"
          fi

          if [ "${{ steps.radon_halstead.outcome }}" = "failure" ]; then
            failed_steps="${failed_steps} Radon Halstead Metrics"
          fi

          if [ -n "$failed_steps" ]; then
            echo "Radon checks failed:$failed_steps"
            exit 1
          fi

      - name: Run Markdown Auto-Delint
        run: |
          git ls-files -z -- "*.md" | xargs -0 -r poetry run mdformat

      - name: Run Markdown Lint
        run: |
          poetry run pymarkdown -d MD013 scan .

      - name: Create Mock Environment
        run: |
          mkdir -p input
          touch input/test_video.mp4

      - name: Run Tests with Coverage
        env:
          AUTO_VHS_SKIP_HW_DETECT: "1"
        run: |
          mkdir -p assets
          poetry run pytest --cov=modules --cov=auto_deinterlancer --cov-branch --cov-report=xml:assets/coverage.xml --cov-report=term --cov-fail-under=90 tests/

      - name: Enforce Per-File Coverage >= 90%
        run: |
          poetry run python .github/scripts/enforce_per_file_coverage.py assets/coverage.xml 90

      - name: Generate Coverage Summary
        run: |
          poetry run python .github/scripts/generate_coverage_summary.py assets/coverage.xml > assets/coverage_summary.md
          cat assets/coverage_summary.md >> $GITHUB_STEP_SUMMARY

  ubuntu_docker_e2e:
    name: "🐳 Ubuntu Docker Real-Dependency E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality_pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and Run Ubuntu Docker E2E Suite
        run: |
          docker build -f docker/Dockerfile.ubuntu -t auto-vhs-ubuntu-e2e:latest .
          docker run --rm auto-vhs-ubuntu-e2e:latest

  macos_e2e:
    name: "🍏 macOS Real-Dependency E2E"
    runs-on: macos-26
    timeout-minutes: 60
    needs: quality_pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install System Media Tools via Homebrew
        run: |
          # Hosted runners can retain an obsolete untrusted AWS tap.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install ffmpeg vapoursynth ffms2

      - name: Run Installer
        env:
          # The bundled FFmpeg 9 build is intentionally minimal and does not
          # provide libsvtav1. E2E AV1 coverage needs the runner's full build.
          AVD_SKIP_FFMPEG: "1"
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Run E2E and Unit Tests on macOS
        env:
          AUTO_VHS_SKIP_HW_DETECT: "1"
        run: |
          .venv/bin/python -m pip install pytest pytest-cov defusedxml
          .venv/bin/python -m pytest -v --no-cov tests/

  windows_e2e:
    name: "🪟 Windows Real-Dependency E2E"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: quality_pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Installer (Non-Interactive)
        shell: pwsh
        env:
          # Keep the full runner FFmpeg available for libsvtav1 AV1 E2E tests.
          AVD_SKIP_FFMPEG: "1"
        run: |
          & .\install.ps1 -NoPause

      - name: Run E2E and Unit Tests on Windows
        shell: pwsh
        env:
          AUTO_VHS_SKIP_HW_DETECT: "1"
        run: |
          .\.VENV\Scripts\python.exe -m pip install pytest pytest-cov defusedxml
          .\.VENV\Scripts\python.exe -m pytest -v --no-cov tests/
