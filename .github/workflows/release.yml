name: Release

# Trigger on version tags like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-release-artifacts:
    name: "📦 Package ${{ matrix.platform }} release artifact"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            archive_extension: zip
          - platform: Linux
            runner: ubuntu-latest
            archive_extension: tar.gz
          - platform: macOS-Intel
            runner: macos-26-intel
            macos: true
            archive_extension: tar.gz
          - platform: macOS-Apple-Silicon
            runner: macos-26
            macos: true
            archive_extension: tar.gz
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches pyproject.toml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep -m 1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "${TAG_VERSION}" != "${TOML_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match pyproject.toml version (${TOML_VERSION})."
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Create Windows release archive
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "Auto-VHS-Deinterlacer-Windows-v${env:VERSION}.zip"
          git archive --format=zip --prefix="Auto-VHS-Deinterlacer-v${env:VERSION}/" --output $archiveName $env:GITHUB_SHA
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create POSIX release archive
        if: matrix.platform != 'Windows'
        shell: bash
        run: |
          archive_name="Auto-VHS-Deinterlacer-${{ matrix.platform }}-v${VERSION}.tar.gz"
          git archive --format=tar --prefix="Auto-VHS-Deinterlacer-v${VERSION}/" "${GITHUB_SHA}" | gzip --no-name > "${archive_name}"
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 1

  verify-release-artifacts:
    name: "🧪 Verify ${{ matrix.platform }} release artifact"
    runs-on: ${{ matrix.runner }}
    needs: package-release-artifacts
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS-Intel
            runner: macos-26-intel
            macos: true
          - platform: macOS-Apple-Silicon
            runner: macos-26
            macos: true
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install macOS media prerequisites
        if: matrix.macos
        run: brew install ffmpeg vapoursynth ffms2

      - name: Download the packaged release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: release-${{ matrix.platform }}
          path: release-assets

      - name: Extract POSIX release artifact into a clean directory
        if: matrix.platform != 'Windows'
        shell: bash
        run: |
          mkdir extracted-release
          tar -xzf release-assets/*.tar.gz --strip-components=1 -C extracted-release
          chmod +x extracted-release/install.sh extracted-release/start.sh

      - name: Extract Windows release artifact into a clean directory
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem release-assets -Filter *.zip).FullName -DestinationPath unpacked-release
          $archiveRoot = Get-ChildItem unpacked-release | Select-Object -First 1
          New-Item -ItemType Directory -Path extracted-release -Force | Out-Null
          Move-Item -Path "$($archiveRoot.FullName)\*" -Destination extracted-release

      - name: Install the packaged POSIX artifact
        if: matrix.platform != 'Windows'
        shell: bash
        working-directory: extracted-release
        run: ./install.sh

      - name: Install the packaged Windows artifact
        if: matrix.platform == 'Windows'
        shell: pwsh
        working-directory: extracted-release
        run: ./install.ps1 -NoPause

      - name: Process generated media with the packaged application
        shell: bash
        working-directory: extracted-release
        env:
          AUTO_VHS_SKIP_HW_DETECT: "1"
        run: |
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            .venv/Scripts/python.exe -m pip install pytest pytest-cov defusedxml
            .venv/Scripts/python.exe -m pytest -v tests/e2e/test_e2e_real_pipeline.py
          else
            .venv/bin/python -m pip install pytest pytest-cov defusedxml
            .venv/bin/python -m pytest -v tests/e2e/test_e2e_real_pipeline.py
          fi

  github-release:
    name: "🚀 Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: verify-release-artifacts
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep -m 1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version  : ${TAG_VERSION}"
          echo "TOML version : ${TOML_VERSION}"
          if [ "${TAG_VERSION}" != "${TOML_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match pyproject.toml version (${TOML_VERSION})."
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Download platform release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Load release notes body
        id: notes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BODY_FILE="docs/releases/v${TAG_VERSION}_github_description.md"
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          if [ -f "${BODY_FILE}" ]; then
            echo "use_body=true" >> "$GITHUB_OUTPUT"
            echo "body_file=${BODY_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "use_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (authored notes)
        if: steps.notes.outputs.use_body == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ steps.notes.outputs.body_file }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true

      - name: Create GitHub Release (generated notes fallback)
        if: steps.notes.outputs.use_body == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
