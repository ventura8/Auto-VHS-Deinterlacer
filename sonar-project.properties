# SonarQube Cloud (sonarcloud.io) project configuration.
# Used by the "Run SonarQube Cloud Scan" CI step and by local sonar-scanner runs.
sonar.projectKey=ventura8_Auto-VHS-Deinterlacer
sonar.organization=ventura8
sonar.projectName=Auto-VHS-Deinterlacer
sonar.projectVersion=1.1.4

sonar.sources=auto_deinterlancer.py,modules,tools,.github/scripts
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=assets/coverage.xml
# Analysed for issues, but outside the pytest --cov scope, so they carry no
# coverage data and must not count against the coverage metric.
sonar.coverage.exclusions=.github/scripts/**,tools/**
sonar.python.xunit.reportPath=assets/pytest-report.xml

sonar.sourceEncoding=UTF-8

# Generated, vendored or environment-only paths carry no reviewable source.
sonar.exclusions=.venv/**,input/**,assets/**,docker/**,**/__pycache__/**,*.vpy
