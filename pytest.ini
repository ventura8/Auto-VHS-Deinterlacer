[pytest]
addopts = --cov=modules --cov=auto_deinterlancer --cov-branch --cov-report=term-missing --cov-report=xml:assets/coverage.xml --cov-fail-under=90
python_files = test_*.py *_test.py
markers =
    e2e: End-to-end integration and pipeline tests.
    real_deps: Real dependency tests requiring installed ffmpeg/vapoursynth binaries.
    docker: Tests running within or validating Docker test container environments.
    dockurr: Tests validating dockurr/windows and dockurr/macos container infrastructure.

