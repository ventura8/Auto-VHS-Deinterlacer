audio_bitrate: 320k
audio_codec: aac
audio_sync_offset: 0.0
auto_drift_correction: true
deinterlace_mode: QTGMC
drift_guard_thresholds:
  max_drift_percent: 1.5
  min_drift_seconds: 0.01
encoder: av1
field_order: tff
qtgmc_settings:
  EZDenoise: 0.0
  Lossless: 2
  NoiseProcess: 0
  Preset: Very Slow
  Sharpness: 0.0
  SourceMatch: 3
tv_standard: auto
