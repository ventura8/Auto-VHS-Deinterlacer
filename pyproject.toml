[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "auto-vhs-deinterlacer"
version = "1.0.2"
description = "Automated deinterlacing and audio synchronization for VHS captures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [
    { name = "Sergiu Alexandrescu", email = "alexandrescu.sergiu@gmail.com" }
]

[tool.poetry]
packages = [
    { include = "auto_deinterlancer.py" },
    { include = "modules" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pyyaml = "^6.0.3"
nvidia-cublas = "13.2.2.2"
nvidia-cuda-runtime = "13.2.75"
nvidia-cuda-nvrtc = "13.2.78"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
genbadge = "^1.1.3"
pylint = "^4.0.6"
flake8 = "^7.1.1"
ruff = "^0.15.21"
defusedxml = "^0.7.1"
pyyaml = "^6.0.3"

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pylint.main]
ignore = [".git", "venv", ".venv"]
ignored-modules = ["yaml", "vapoursynth"]
extension-pkg-allow-list = ["vapoursynth"]

[tool.pylint.format]
max-line-length = 140

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 40
max-branches = 25
max-statements = 90
max-nested-blocks = 10
min-public-methods = 0

[tool.mypy]
python_version = "3.12"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"
