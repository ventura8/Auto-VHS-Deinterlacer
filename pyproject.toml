[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "auto-vhs-deinterlacer"
version = "1.1.10"
description = "Automated deinterlacing and audio synchronization for VHS captures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [
    { name = "Sergiu Alexandrescu", email = "alexandrescu.sergiu@gmail.com" }
]

[tool.poetry]
packages = [
    { include = "auto_deinterlancer.py" },
    { include = "modules" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pyyaml = "^6.0.3"

[tool.poetry.group.ml-heavy]
optional = true

[tool.poetry.group.ml-heavy.dependencies]
torch = { version = "2.15.0+cu134", source = "pytorch-cu134", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchvision = { version = "0.29.2+cu134", source = "pytorch-cu134", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchaudio = { version = "2.11.1", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
audio-separator = { version = "^0.48.0", extras = ["gpu"], markers = "platform_system != 'Darwin'" }
# CUDA component pins below align with the prebuilt torch 2.15.0+cu134 wheel,
# which is built against cuda-toolkit 13.4.1 (cudart 13.4.49 / nvrtc 13.4.59 /
# cublas 13.7.0.27; cudnn mirrors torch's declared 9.26.0.51). Newer component
# builds (cudart/nvrtc 13.4.92, cublas 13.8.x) are not adopted until PyTorch
# ships a wheel built against them.
nvidia-cudnn-cu13 = { version = "9.26.0.51", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
nvidia-cublas = { version = "13.7.0.27", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
onnxruntime-gpu = { version = "^1.31.1", extras = ["cuda", "cudnn"], markers = "platform_system != 'Darwin'" }
# Darwin is excluded to match audio-separator above: the numba/llvmlite chain
# librosa pulls has no macOS x86_64 wheel and would fall back to a source build
# (needs system LLVM). Prefer no install over building — see AGENTS.md.
librosa = { version = "^1.0.0", markers = "platform_system != 'Darwin'" }
nvidia-cuda-runtime = { version = "13.4.49", markers = "platform_system != 'Darwin'" }
nvidia-cuda-nvrtc = { version = "13.4.59", markers = "platform_system != 'Darwin'" }
vapoursynth = "==79"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
genbadge = "^1.1.3"
pylint = "^4.1.3"
flake8 = "^7.5.0"
ruff = "^0.17.3"
isort = "^9.0.2"
radon = "^6.0.1"
defusedxml = "^0.7.1"
mdformat = "^1.0.0"
mdformat-frontmatter = "^2.2.0"
pymarkdownlnt = "^0.9.41"
black = "^26.10.1"
taplo = "^0.9.3"
bandit = "^1.9.4"
pip-audit = "^2.10.1"

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.isort]
line_length = 140
py_version = 312
profile = "black"
skip = [".git", ".venv", "build", "dist"]

[tool.black]
line-length = 140
target-version = ["py312"]
extend-exclude = '(\.venv|build|dist)'

[tool.pylint.main]
ignore = [".git", "venv", ".venv"]
ignored-modules = ["yaml", "vapoursynth"]
extension-pkg-allow-list = ["vapoursynth"]

[tool.pylint.format]
max-line-length = 140

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 40
max-branches = 25
max-statements = 90
max-nested-blocks = 10
min-public-methods = 0

[tool.mypy]
python_version = "3.12"

[[tool.poetry.source]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
priority = "explicit"
