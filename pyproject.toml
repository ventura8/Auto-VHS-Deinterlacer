[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "auto-vhs-deinterlacer"
version = "1.1.1"
description = "Automated deinterlacing and audio synchronization for VHS captures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]
authors = [
    { name = "Sergiu Alexandrescu", email = "alexandrescu.sergiu@gmail.com" }
]

[tool.poetry]
packages = [
    { include = "auto_deinterlancer.py" },
    { include = "modules" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pyyaml = "^6.0.3"

[tool.poetry.group.ml-heavy]
optional = true

[tool.poetry.group.ml-heavy.dependencies]
torch = { version = "2.13.0+cu132", source = "pytorch-cu132", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchvision = { version = "0.28.0+cu132", source = "pytorch-cu132", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
torchaudio = { version = "2.11.0", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
audio-separator = { version = "^0.47.0", extras = ["gpu"], markers = "platform_system != 'Darwin'" }
# CUDA component pins below align with the prebuilt torch 2.13.0+cu132 wheel,
# which is built and tested against CUDA 13.2. CUDA 13.3.1 (cudart 13.3.29 /
# nvrtc 13.3.33 / cublas 13.6.0.2) cannot be adopted until PyTorch publishes a
# cu133 build on one of the checked stable, test, or nightly wheel indexes.
nvidia-cudnn-cu13 = { version = "9.20.0.48", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
nvidia-cublas = { version = "13.4.0.1", markers = "platform_system == 'Windows' and python_version == '3.12' and implementation_name == 'cpython'" }
onnxruntime-gpu = { version = "^1.29.0", extras = ["cuda", "cudnn"], markers = "platform_system != 'Darwin'" }
# Darwin is excluded to match audio-separator above: the numba/llvmlite chain
# librosa pulls has no macOS x86_64 wheel and would fall back to a source build
# (needs system LLVM). Prefer no install over building — see AGENTS.md.
librosa = { version = "^1.0.0", markers = "platform_system != 'Darwin'" }
nvidia-cuda-runtime = { version = "13.2.75", markers = "platform_system != 'Darwin'" }
nvidia-cuda-nvrtc = { version = "13.2.78", markers = "platform_system != 'Darwin'" }
vapoursynth = "==79"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
genbadge = "^1.1.3"
pylint = "^4.0.8"
flake8 = "^7.3.0"
ruff = "^0.16.5"
isort = "^9.0.1"
radon = "^6.0.1"
defusedxml = "^0.7.1"
mdformat = "^1.0.0"
mdformat-frontmatter = "^2.1.2"
pymarkdownlnt = "^0.9.39"
black = "^26.5.1"
taplo = "^0.9.3"
bandit = "^1.9.4"
pip-audit = "^2.10.1"

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.isort]
line_length = 140
py_version = 312
profile = "black"
skip = [".git", ".venv", "build", "dist"]

[tool.black]
line-length = 140
target-version = ["py312"]
extend-exclude = '(\.venv|build|dist)'

[tool.pylint.main]
ignore = [".git", "venv", ".venv"]
ignored-modules = ["yaml", "vapoursynth"]
extension-pkg-allow-list = ["vapoursynth"]

[tool.pylint.format]
max-line-length = 140

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 40
max-branches = 25
max-statements = 90
max-nested-blocks = 10
min-public-methods = 0

[tool.mypy]
python_version = "3.12"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"
